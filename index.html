<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加密狙擊</title>
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
/* 基礎 UI */
#auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
#auth-overlay h2 { color: #f7931a; margin-bottom: 20px; }
#auth-overlay input { padding: 12px; width: 200px; background: #111; color: white; border: 1px solid #444; border-radius: 8px; text-align: center; font-size: 16px; margin-bottom: 15px; }
#auth-overlay button { background: #f7931a; color: black; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }

body{ background:#000; color:white; font-family:Arial, sans-serif; margin:0; text-align:center; }
h1{ color:#f7931a; margin-top:15px; font-size: 24px; }

/* 主頁儀表板 */
.dashboard { display: flex; justify-content: center; gap: 20px; padding: 20px; flex-wrap: wrap; }
.dash-card { background: #111; border: 1px solid #444; border-radius: 12px; padding: 20px; width: 300px; text-align: left; }
.dash-card h3 { color: #f7931a; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
.dash-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; font-weight: bold; }
.dash-item span:first-child { color: #fff; }

/* 導航與分頁 */
.nav{ display:flex; justify-content:center; gap:10px; margin:10px; flex-wrap:wrap; }
.nav button{ background:#222; color:white; border:1px solid #444; padding:10px 12px; border-radius:8px; cursor:pointer; font-weight:bold; }
.nav button:hover{ border-color:#f7931a; }
.page{ display:none; }
.page.active{ display:block; }
.topBar{ display:flex; justify-content:space-between; width:850px; margin:10px auto; gap:10px; }
.topBar input{ padding:10px; width:250px; background:#111; color:white; border:1px solid #444; border-radius:8px; }
.tabs{ display:flex; gap:5px; }
.tabs button{ background:#222; color:white; border:1px solid #444; padding:8px 12px; border-radius:6px; cursor:pointer; flex:1; }
.tabs button.active{ background:#f7931a; color:black; font-weight:bold; }

/* 表格與列表 */
table{ margin:20px auto; width:850px; border-collapse:collapse; }
th,td{ border:1px solid #444; padding:10px; text-align:center; }
th{ background:#111; color:#aaa; }
.coin{ display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; }
.coin img{ width:18px; height:18px; object-fit:contain; border-radius:50%; background:#111; padding:2px; }
.score-cell { cursor: pointer; font-weight: bold; transition: 0.3s; color: #f7931a; }
.score-bullish { color: #26a69a !important; }
.score-bearish { color: #ef5350 !important; }

/* 彈出視窗與動畫 */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); z-index: 10000; display: none; justify-content: center; align-items: center; }
.modal-content { background: #000000; border: 2px solid #444; border-radius: 12px; width: 420px; max-width: 90%; padding: 25px; box-shadow: 0 0 25px rgba(247,147,26,0.15); position: relative; animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
@keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.modal-table { width: 100%; border-collapse: collapse; }
.modal-table td { border: 1px solid #333; padding: 12px; color: #fff; }
.modal-close-btn { display: block; background: #222; color: white; border: 1px solid #444; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin: 15px auto 0 auto; }
.modal-close-btn:hover { background: #f7931a; color: black; }

/* 圖表 */
#chart{ position:fixed; top:0; left:0; width:100vw; height:100vh; background:black; z-index:999; display:none; }
#chart.active{ display:block; }
#tv_chart{ width:100%; height:100%; }
#backBtn{ position:fixed; top:10px; right:10px; z-index:1000; background:#222; color:white; border:1px solid #444; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:bold; }

@media (max-width: 768px){ h1{ font-size:18px; } .topBar{ width:95%; flex-direction:column; } .topBar input{ width:100%; } table{ width:95%; font-size:12px; } }
</style>
</head>
<body>

<div id="auth-overlay">
    <h2>🔒 加密狙擊</h2>
    <input type="password" id="passInput" placeholder="請輸入授權邀請碼">
    <button onclick="checkPassword()">確認登入</button>
</div>

<h1>加密狙擊</h1>

<div class="nav">
  <button onclick="show('home')">主頁</button>
  <button onclick="show('market')">市場</button>
  <button onclick="show('chartPage')">圖表</button>
</div>

<div id="home" class="page active">
    <div class="dashboard">
        <div class="dash-card">
            <h3>🔥 漲幅榜</h3>
            <div id="gainers-list">載入中...</div>
        </div>
        <div class="dash-card">
            <h3>📉 跌幅榜</h3>
            <div id="losers-list">載入中...</div>
        </div>
    </div>
</div>

<div id="market" class="page">
    <div class="topBar">
        <input id="searchInput" placeholder="搜尋 BTC / ETH">
        <div class="tabs">
            <button class="active" onclick="setMode('price',event)">價格</button>
            <button onclick="setMode('gainers',event)">漲幅榜</button>
            <button onclick="setMode('losers',event)">跌幅榜</button>
        </div>
    </div>
    <table>
        <thead><tr><th>幣種</th><th>價格</th><th>24h%</th><th>數據</th></tr></thead>
        <tbody id="marketBody"></tbody>
    </table>
</div>

<div id="chart">
    <button id="backBtn" onclick="backToMarket()">← 返回</button>
    <div id="tv_chart"></div>
</div>

<div id="scoreModal" class="modal-overlay" onclick="closeScoreModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 id="modalTitle" style="color: #f7931a; margin-top: 0; font-size: 18px; text-align: center;"></h3>
        <table class="modal-table">
            <tr><td>資金費率</td><td><span id="fundingRateValue">載入中...</span></td></tr>
            <tr><td>24h 成交量</td><td><span id="volumeValue">載入中...</span></td></tr>
            <tr><td>未平倉量 (OI)</td><td><span id="openInterestValue">載入中...</span></td></tr>
        </table>
        <button class="modal-close-btn" onclick="document.getElementById('scoreModal').style.display='none'">關閉</button>
    </div>
</div>

<script>
const SYSTEM_PASSWORD = "Du0x2L1uSniper"; 
let coinData = {}; 
let mode = "price";
let currentSymbol = "BTC";
let ws = null; 

function checkPassword() {
    const userInput = document.getElementById("passInput").value;
    if(userInput === SYSTEM_PASSWORD) {
        document.getElementById("auth-overlay").style.display = "none";
        localStorage.setItem("sniper_auth", "true");
        initSystem();
    } else { alert("邀請碼錯誤！"); }
}

window.onload = function() {
    if(localStorage.getItem("sniper_auth") === "true") {
        document.getElementById("auth-overlay").style.display = "none";
        initSystem();
    }
}

function show(id){
    document.getElementById("home").classList.remove("active");
    document.getElementById("market").classList.remove("active");
    document.getElementById("chart").classList.remove("active");
    if(id === "chartPage" || id === "chart") {
        document.getElementById("chart").classList.add("active");
        loadTVChart(currentSymbol);
    } else { document.getElementById(id).classList.add("active"); }
}

function backToMarket(){
    document.getElementById("chart").classList.remove("active");
    document.getElementById("market").classList.add("active");
}

function updateHomeDashboards() {
    const arr = Object.values(coinData);
    if (arr.length === 0) return;
    arr.sort((a,b) => b.change - a.change);
    document.getElementById('gainers-list').innerHTML = arr.slice(0, 3).map((c, i) => `<div class="dash-item"><span>${i+1}. ${c.symbol}</span><span style="color:#26a69a">+${c.change}%</span></div>`).join('');
    arr.sort((a,b) => a.change - b.change);
    document.getElementById('losers-list').innerHTML = arr.slice(0, 3).map((c, i) => `<div class="dash-item"><span>${i+1}. ${c.symbol}</span><span style="color:#ef5350">${c.change}%</span></div>`).join('');
}

function render(){
    const rowsArray = Object.values(coinData);
    if(mode === "gainers") rowsArray.sort((a,b)=>b.change-a.change);
    else if(mode === "losers") rowsArray.sort((a,b)=>a.change-b.change);
    else rowsArray.sort((a,b)=>b.priceRaw-a.priceRaw);
    
    const marketBody = document.getElementById("marketBody");
    const filterText = document.getElementById("searchInput").value.toUpperCase();
    marketBody.innerHTML = "";
    rowsArray.forEach(r => {
        if(r.symbol.includes(filterText)) marketBody.appendChild(r.el);
    });
    updateHomeDashboards();
}

document.getElementById("searchInput").addEventListener("input", render);
function setMode(type,event){
    mode = type;
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
    event.target.classList.add("active");
    render();
}

function openChart(symbol){ currentSymbol = symbol; show('chart'); }
function openScoreModal(symbol) {
    document.getElementById("modalTitle").innerText = `${symbol} 數據詳情`;
    document.getElementById("scoreModal").style.display = "flex";
    const pair = `${symbol}USDT`;
    fetch(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${pair}`).then(res=>res.json()).then(d=>{
        document.getElementById("volumeValue").innerText = `$${(parseFloat(d.quoteVolume)/1000000).toFixed(2)} M`;
    });
    fetch(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${pair}`).then(res=>res.json()).then(d=>{
        const rate = parseFloat(d.lastFundingRate);
        const el = document.getElementById("fundingRateValue");
        el.innerText = (rate*100).toFixed(4) + "%";
        el.style.color = rate > 0 ? "#ef5350" : (rate < 0 ? "#26a69a" : "#fff");
    });
    fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${pair}`).then(res=>res.json()).then(d=>{
        const val = (parseFloat(d.openInterest) * coinData[symbol].priceRaw) / 1000000;
        document.getElementById("openInterestValue").innerText = `$${val.toFixed(2)} M`;
    });
}
function closeScoreModal(event) { document.getElementById("scoreModal").style.display = "none"; }

function loadTVChart(symbol) {
    currentSymbol = symbol; 
    document.getElementById("tv_chart").innerHTML = "";
    tvWidget = new TradingView.widget({
        container_id: "tv_chart", width: "100%", height: "100%",
        symbol: "BINANCE:" + symbol + "USDT",
        interval: "60", theme: "dark", style: "1", locale: "zh_TW",
        toolbar_bg: "#000000", overrides: { "volumePaneSize": "none" }, studies_overrides: { "volume.volume.visible": false }
    });
}

function calculateSystemScores(symbolsArray) {
    Promise.all([
        fetch("https://fapi.binance.com/fapi/v1/premiumIndex").then(r => r.json()),
        fetch("https://fapi.binance.com/fapi/v1/ticker/24hr").then(r => r.json()),
        fetch("https://fapi.binance.com/fapi/v1/openInterest").then(r => r.json())
    ]).then(([pData, tData, oiData]) => {
        const pMap = Object.fromEntries(pData.map(p => [p.symbol, p]));
        const tMap = Object.fromEntries(tData.map(t => [t.symbol, t]));
        const oiMap = Object.fromEntries(oiData.map(o => [o.symbol, o]));
        symbolsArray.forEach(symbol => {
            const pair = `${symbol}USDT`;
            if (!pMap[pair] || !tMap[pair] || !oiMap[pair] || !coinData[symbol]) return;
            const fRate = parseFloat(pMap[pair].lastFundingRate) || 0;
            const qVolM = parseFloat(tMap[pair].quoteVolume) / 1000000 || 0;
            const oiValM = (parseFloat(oiMap[pair].openInterest) * coinData[symbol].priceRaw) / 1000000 || 0;
            let finalScore = -(fRate * 2000); 
            if (qVolM > 500) finalScore += (fRate < 0 ? 20 : -20);
            if (oiValM > 50) finalScore += (fRate < 0 ? 20 : -20);
            finalScore = Math.max(-100, Math.min(100, Math.round(finalScore)));
            if (coinData[symbol]) {
                coinData[symbol].score = finalScore;
                const scoreCell = coinData[symbol].el.querySelector(".score-cell");
                scoreCell.innerText = finalScore;
                scoreCell.classList.remove("score-bullish", "score-bearish");
                if (finalScore > 5) scoreCell.classList.add("score-bullish");
                else if (finalScore < -5) scoreCell.classList.add("score-bearish");
            }
        });
        updateHomeDashboards();
    }).catch(e => console.log("計算失敗", e));
}

function initSystem() {
    fetch("https://fapi.binance.com/fapi/v1/ticker/24hr")
    .then(res => res.json())
    .then(data => {
        const blacklist = ["BUSD", "EUR", "GBP", "AUD", "DAI", "USDC", "UP", "DOWN", "BEAR", "BULL", "BTT"];
        const symbolList = [];
        data.filter(x => x.symbol.endsWith("USDT") && !blacklist.some(b => x.symbol.includes(b))).forEach(item => {
            const symbol = item.symbol.replace("USDT","");
            symbolList.push(symbol);
            const row = document.createElement("tr");
            row.innerHTML = `<td><div class="coin" onclick="openChart('${symbol}')"><img src="https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/${symbol.toLowerCase()}.png" onerror="this.src='https://cryptoicons.org/api/icon/${symbol.toLowerCase()}/50'"><span>${symbol}</span></div></td><td class="price-cell">$${parseFloat(item.lastPrice).toFixed(2)}</td><td class="change-cell" style="color:${+item.priceChangePercent >= 0 ? '#26a69a' : '#ef5350'}">${+item.priceChangePercent >= 0 ? '+' : ''}${item.priceChangePercent}%</td><td class="score-cell" onclick="openScoreModal('${symbol}')">--</td>`;
            coinData[symbol] = { symbol, priceRaw: parseFloat(item.lastPrice), change: +item.priceChangePercent, el: row };
        });
        render(); startWebSocket(); calculateSystemScores(symbolList);
        setInterval(() => { calculateSystemScores(symbolList); }, 30000);
    });
}

function startWebSocket() {
    ws = new WebSocket("wss://fstream.binance.com/ws/!miniTicker@arr");
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        data.forEach(item => {
            if (item.s.endsWith("USDT")) {
                const symbol = item.s.replace("USDT", "");
                if (coinData[symbol]) {
                    const newPrice = parseFloat(item.c);
                    coinData[symbol].priceRaw = newPrice;
                    coinData[symbol].el.querySelector(".price-cell").innerText = `$${newPrice.toFixed(2)}`;
                }
            }
        });
    };
    ws.onclose = () => { setTimeout(startWebSocket, 3000); };
}
</script>
</body>
</html>
