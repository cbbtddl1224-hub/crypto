<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>加密狙擊</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    background:#000;
    color:white;
    font-family:Arial;
    margin:0;
    text-align:center;
}

h1{
    color:#f7931a;
    margin-top:15px;
}

/* NAV */
.nav{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:10px;
    flex-wrap:wrap;
}

.nav button{
    background:#222;
    color:white;
    border:1px solid #444;
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
}

/* PAGES */
.page{ display:none; }
.page.active{ display:block; }

/* TOP BAR */
.topBar{
    display:flex;
    justify-content:space-between;
    width:850px;
    margin:10px auto;
    gap:10px;
}

.topBar input{
    padding:10px;
    width:250px;
    background:#111;
    color:white;
    border:1px solid #444;
    border-radius:8px;
}

/* TABS */
.tabs{
    display:flex;
    gap:5px;
}

.tabs button{
    background:#222;
    color:white;
    border:1px solid #444;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    flex:1;
}

.tabs button.active{
    background:#f7931a;
    color:black;
}

/* TABLE */
table{
    margin:20px auto;
    width:850px;
    border-collapse:collapse;
}

th,td{
    border:1px solid #444;
    padding:10px;
    text-align:center;
}

/* COIN */
.coin{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
}

.coin img{
    width:18px;
    height:18px;
    object-fit:contain;
    border-radius:50%;
    background:#111;
    padding:2px;
}

/* =========================
   CHART FULLSCREEN
========================= */
#chart{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:black;
    z-index:999;
    display:none;
}

#chart.active{
    display:block;
}

#tv_chart{
    width:100%;
    height:100%;
}

/* 返回鍵 */
#backBtn{
    position:fixed;
    top:10px;
    right:10px;
    z-index:1000;

    background:#222;
    color:white;
    border:1px solid #444;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

/* =========================
   MOBILE FIX
========================= */
@media (max-width: 768px){

    h1{
        font-size:18px;
    }

    .topBar{
        width:95%;
        flex-direction:column;
    }

    .topBar input{
        width:100%;
    }

    table{
        width:95%;
        font-size:12px;
    }

    th,td{
        padding:6px;
    }

    .nav button{
        padding:8px;
        font-size:12px;
    }

    .tabs button{
        font-size:12px;
        padding:6px;
    }

    .coin img{
        width:14px;
        height:14px;
    }
}
</style>
</head>

<body>

<h1>加密狙擊</h1>

<div class="nav">
  <button onclick="show('home')">主頁</button>
  <button onclick="show('market')">市場</button>
  <button onclick="show('chart')">圖表</button>
</div>

<!-- HOME -->
<div id="home" class="page active">
  <h2>主頁</h2>
</div>

<!-- MARKET -->
<div id="market" class="page">

    <h2>市場</h2>

    <div class="topBar">
        <input id="searchInput" placeholder="搜尋 BTC / ETH">

        <div class="tabs">
            <button class="active" onclick="setMode('price',event)">價格</button>
            <button onclick="setMode('gainers',event)">漲幅榜</button>
            <button onclick="setMode('losers',event)">跌幅榜</button>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>幣種</th>
            <th>價格</th>
            <th>24h%</th>
            <th>分數</th>
        </tr>
        </thead>
        <tbody id="marketBody"></tbody>
    </table>

</div>

<!-- CHART -->
<div id="chart">
    <button id="backBtn" onclick="backToMarket()">← 返回</button>
    <div id="tv_chart"></div>
</div>

<script>

/* PAGE */
function show(id){

    document.getElementById("home").classList.remove("active");
    document.getElementById("market").classList.remove("active");
    document.getElementById("chart").classList.remove("active");

    if(id === "chart"){
        document.getElementById("chart").classList.add("active");
    }else{
        document.getElementById(id).classList.add("active");
    }
}

function backToMarket(){
    document.getElementById("chart").classList.remove("active");
    document.getElementById("market").classList.add("active");
}

/* STATE */
let rows = [];
let mode = "price";
let tv = null;

/* MARKET */
const marketBody = document.getElementById("marketBody");
const searchInput = document.getElementById("searchInput");

function setMode(type,event){
    mode = type;

    document.querySelectorAll(".tabs button")
        .forEach(b=>b.classList.remove("active"));

    event.target.classList.add("active");

    render();
}

function render(){
    let sorted = [...rows];

    if(mode === "gainers")
        sorted.sort((a,b)=>b.change-a.change);
    else if(mode === "losers")
        sorted.sort((a,b)=>a.change-b.change);
    else
        sorted.sort((a,b)=>b.priceRaw-a.priceRaw);

    marketBody.innerHTML="";
    sorted.forEach(r=>marketBody.appendChild(r.el));
}

searchInput.addEventListener("input",function(){
    const v=this.value.toUpperCase();
    rows.forEach(r=>{
        r.el.style.display = r.symbol.includes(v) ? "" : "none";
    });
});

/* CHART */
function openChart(symbol){
    show('chart');
    loadTV(symbol);
}

function loadTV(symbol){

    if(tv){
        tv.remove();
    }

    tv = new TradingView.widget({

        container_id: "tv_chart",
        width: "100%",
        height: "100%",

        symbol: "BINANCE:" + symbol + "USDT",
        interval: "1",
        theme: "dark",
        style: "1",

        locale: "zh_TW",

        studies: [],

        hide_legend: true,
        hide_top_toolbar: false,

        drawings_access: {
            type: "all",
            tools: [
                { name: "Trend Line" },
                { name: "Horizontal Line" },
                { name: "Ray" },
                { name: "Regression Trend" }
            ]
        }
    });
}

/* DATA */
fetch("https://api.binance.com/api/v3/ticker/24hr")
.then(r=>r.json())
.then(data=>{

    const usdt = data.filter(x=>x.symbol.endsWith("USDT"));

    usdt.forEach(item=>{

        const symbol = item.symbol.replace("USDT","");

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>
                <div class="coin" onclick="openChart('${symbol}')">
                    <img src="https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/${symbol.toLowerCase()}.png"
                         onerror="this.src='https://cryptoicons.org/api/icon/${symbol.toLowerCase()}/50'">
                    <span>${symbol}</span>
                </div>
            </td>
            <td>$${(+item.lastPrice).toFixed(2)}</td>
            <td>${item.priceChangePercent}%</td>
            <td></td>
        `;

        rows.push({
            symbol,
            change:+item.priceChangePercent,
            priceRaw:+item.lastPrice,
            el:row
        });
    });

    render();
});

/* DEFAULT */
loadTV("BTC");

</script>

</body>
</html>
