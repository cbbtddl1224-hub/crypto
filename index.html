<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>加密狙擊</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="加密狙擊">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/825/825488.png">

<style>
/* 針對 iPhone 瀏海與底部安全區域的適配 */
body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

#auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
#auth-overlay h2 { color: #f7931a; margin-bottom: 20px; }
#auth-overlay input { padding: 12px; width: 200px; background: #111; color: white; border: 1px solid #444; border-radius: 8px; text-align: center; font-size: 16px; margin-bottom: 15px; }
#auth-overlay button { background: #f7931a; color: black; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }

body { background:#000; color:white; font-family:Arial,sans-serif; margin:0; text-align:center; }
h1 { color:#f7931a; margin-top:15px; font-size:24px; }

@keyframes flashGreen {
  0%   { color: #00ff88; transform: scale(1.06); text-shadow: 0 0 8px #00ff88; }
  40%  { color: #00ff88; transform: scale(1.02); }
  100% { color: white;   transform: scale(1);    text-shadow: none; }
}
@keyframes flashRed {
  0%   { color: #ff2222; transform: scale(1.06); text-shadow: 0 0 8px #ff2222; }
  40%  { color: #ff4444; transform: scale(1.02); }
  100% { color: white;   transform: scale(1);    text-shadow: none; }
}
.flash-up   { animation: flashGreen 1.8s ease-out forwards; }
.flash-down { animation: flashRed   1.8s ease-out forwards; }

.dashboard { display:flex; justify-content:center; gap:20px; padding:20px; flex-wrap:wrap; }
.dash-card { background:#111; border:1px solid #444; border-radius:12px; padding:20px; width:300px; text-align:left; }
.dash-card h3 { color:#f7931a; margin-top:0; border-bottom:1px solid #333; padding-bottom:10px; }
.dash-item { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #222; font-weight:bold; }
.dash-item span:first-child { color:#fff; }

.nav { display:flex; justify-content:center; gap:10px; margin:10px; flex-wrap:wrap; }
.nav button { background:#222; color:white; border:1px solid #444; padding:10px 12px; border-radius:8px; cursor:pointer; font-weight:bold; }
.nav button:hover { border-color:#f7931a; }
.page { display:none; }
.page.active { display:block; }
.topBar { display:flex; justify-content:space-between; width:850px; margin:10px auto; gap:10px; align-items:center; }
.topBar input { padding:10px; width:250px; background:#111; color:white; border:1px solid #444; border-radius:8px; }
.tabs { display:flex; gap:5px; }
.tabs button { background:#222; color:white; border:1px solid #444; padding:8px 12px; border-radius:6px; cursor:pointer; flex:1; white-space:nowrap; }
.tabs button.active { background:#f7931a; color:black; font-weight:bold; }

table { margin:20px auto; width:850px; border-collapse:collapse; }
th,td { border:1px solid #444; padding:10px; text-align:center; }
th { background:#111; color:#aaa; }

.coin { display:flex; align-items:center; justify-content:center; gap:8px; }
.coin img { width:20px; height:20px; object-fit:contain; border-radius:50%; background:#333; padding:2px; }

.score-cell { cursor:pointer; font-weight:bold; transition:0.3s; color:#f7931a; }
.score-bullish { color:#26a69a !important; }
.score-bearish { color:#ef5350 !important; }

td[id^="price-"] { font-weight:bold; letter-spacing:0.5px; }

.modal-overlay { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.75); z-index:10000; display:none; justify-content:center; align-items:center; }
.modal-content { background:#000; border:2px solid #444; border-radius:12px; width:450px; max-width:90%; padding:25px; box-shadow:0 0 25px rgba(247,147,26,0.15); }
.modal-table { width:100%; border-collapse:collapse; font-size:14px; }
.modal-table td { border:1px solid #333; padding:10px; color:#fff; position:relative; }
.modal-close-btn { display:block; background:#222; color:white; border:1px solid #444; padding:8px 16px; border-radius:6px; cursor:pointer; margin:15px auto 0; }
.modal-close-btn:hover { background:#f7931a; color:black; }

/* 彈窗時區切換按鈕樣式 */
.modal-tf-tabs { display:flex; gap:5px; margin:15px 0; justify-content:center; }
.modal-tf-tabs button { background:#222; color:white; border:1px solid #444; padding:6px 12px; border-radius:6px; cursor:pointer; flex:1; font-size:13px; font-weight:bold; transition:0.2s; }
.modal-tf-tabs button.active { background:#f7931a; color:black; border-color:#f7931a; }

.sparkline { width:70px; height:25px; vertical-align:middle; margin-left:10px; display:none; }
.sparkline.active { display:inline-block; }

@media(max-width:768px){ 
  h1{font-size:18px} 
  .topBar{width:95%;flex-direction:column} 
  .topBar input{width:100%} 
  table{width:95%;font-size:12px} 
  .tabs { width: 100%; }
  .tabs button { font-size: 12px; padding: 6px 10px; }
}
</style>
</head>
<body>

<div id="auth-overlay">
  <h2>🔒 加密狙擊</h2>
  <input type="password" id="passInput" placeholder="請輸入授權邀請碼">
  <button onclick="checkPassword()">確認登入</button>
</div>

<h1>加密狙擊</h1>

<div class="nav">
  <button onclick="show('home')">主頁</button>
  <button onclick="show('market')">市場</button>
</div>

<div id="home" class="page active">
  <div class="dashboard">
    <div class="dash-card"><h3>🔥 漲幅榜</h3><div id="gainers-list">載入中...</div></div>
    <div class="dash-card"><h3>📉 跌幅榜</h3><div id="losers-list">載入中...</div></div>
  </div>
</div>

<div id="market" class="page">
  <div class="topBar">
    <input id="searchInput" placeholder="搜尋 BTC / ETH">
    <div class="tabs">
      <button class="active" onclick="setMode('price',event)">價格</button>
      <button onclick="setMode('gainers',event)">漲幅榜</button>
      <button onclick="setMode('losers',event)">跌幅榜</button>
      <button onclick="setMode('watchlist',event)">自選清單</button>
    </div>
  </div>
  <table>
    <thead><tr><th>幣種</th><th>價格</th><th>24h%</th><th>數據</th></tr></thead>
    <tbody id="marketBody"></tbody>
  </table>
</div>

<div id="scoreModal" class="modal-overlay" onclick="closeScoreModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 id="modalTitle" style="color:#f7931a;margin-top:0;font-size:18px;text-align:center;margin-bottom:5px;"></h3>
    
    <div class="modal-tf-tabs">
      <button data-tf="15m" onclick="changeModalTimeframe('15m')">15分鐘</button>
      <button data-tf="30m" onclick="changeModalTimeframe('30m')">30分鐘</button>
      <button data-tf="1h" onclick="changeModalTimeframe('1h')">1小時</button>
      <button data-tf="4h" onclick="changeModalTimeframe('4h')">4小時</button>
    </div>

    <table class="modal-table">
      <tr>
        <td>價格走勢</td>
        <td><span id="priceTrendValue">--</span><canvas id="canvas-price" class="sparkline" width="140" height="50"></canvas></td>
      </tr>
      <tr><td>資金費率</td><td><span id="fundingRateValue">--</span></td></tr>
      <tr><td>24h 成交量</td><td><span id="volumeValue">--</span></td></tr>
      <tr><td>未平倉量 (OI)</td><td><span id="openInterestValue">--</span><canvas id="canvas-oi" class="sparkline" width="140" height="50"></canvas></td></tr>
      <tr><td>多空人數比</td><td><span id="longShortRatio">--</span><canvas id="canvas-lsr" class="sparkline" width="140" height="50"></canvas></td></tr>
      <tr><td>合約 CVD</td><td><span id="futureCvdValue">--</span><canvas id="canvas-fcvd" class="sparkline" width="140" height="50"></canvas></td></tr>
      <tr><td>現貨 CVD</td><td><span id="spotCvdValue">--</span><canvas id="canvas-scvd" class="sparkline" width="140" height="50"></canvas></td></tr>
    </table>
    <button class="modal-close-btn" onclick="closeScoreModal(event)">關閉</button>
  </div>
</div>

<script>
const SYSTEM_PASSWORD = "Du0x2L1uSniper";
let coinData = {};
let mode = "price";
let watchlist = JSON.parse(localStorage.getItem("sniper_watchlist") || "[]");

// 追蹤當前打開的彈窗幣種與時區
let activeModalSymbol = "";
let activeModalTimeframe = "1h";

let spotWs = null;
let futureWs = null;

function fmtPrice(p) {
  if (p >= 1000) return p.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (p >= 1)    return p.toFixed(4);
  return p.toFixed(6);
}

function checkPassword() {
  if (document.getElementById("passInput").value === SYSTEM_PASSWORD) {
    document.getElementById("auth-overlay").style.display = "none";
    localStorage.setItem("sniper_auth","true");
    initSystem();
  } else { alert("邀請碼錯誤！"); }
}

window.onload = function() {
  if (localStorage.getItem("sniper_auth") === "true") {
    document.getElementById("auth-overlay").style.display = "none";
    initSystem();
  }
};

function show(id) {
  ["home","market"].forEach(p => document.getElementById(p).classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function updateHomeDashboards() {
  const arr = Object.values(coinData);
  if (!arr.length) return;
  arr.sort((a,b) => b.change - a.change);
  document.getElementById('gainers-list').innerHTML = arr.slice(0,3).map((c,i) =>
    `<div class="dash-item"><span>${i+1}. ${c.symbol}</span><span style="color:#26a69a">+${c.change.toFixed(2)}%</span></div>`).join('');
  arr.sort((a,b) => a.change - b.change);
  document.getElementById('losers-list').innerHTML = arr.slice(0,3).map((c,i) =>
    `<div class="dash-item"><span>${i+1}. ${c.symbol}</span><span style="color:#ef5350">${c.change.toFixed(2)}%</span></div>`).join('');
}

function render() {
  const arr = Object.values(coinData);
  if (mode === "gainers")      arr.sort((a,b) => b.change - a.change);
  else if (mode === "losers")  arr.sort((a,b) => a.change - b.change);
  else                         arr.sort((a,b) => b.priceRaw - a.priceRaw);
  
  const body = document.getElementById("marketBody");
  const q = document.getElementById("searchInput").value.toUpperCase();
  body.innerHTML = "";
  
  arr.forEach(r => { 
    if (r.symbol.includes(q)) {
      if (mode === "watchlist" && !watchlist.includes(r.symbol)) return;
      body.appendChild(r.el); 
    }
  });
  updateHomeDashboards();
}

document.getElementById("searchInput").addEventListener("input", render);

function setMode(type, event) {
  mode = type;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
  render();
}

function toggleWatchlist(symbol, event) {
  event.stopPropagation();
  const idx = watchlist.indexOf(symbol);
  const btn = document.getElementById(`fav-${symbol}`);
  if (idx > -1) {
    watchlist.splice(idx, 1);
    if (btn) btn.innerText = '☆';
  } else {
    watchlist.push(symbol);
    if (btn) btn.innerText = '★';
  }
  localStorage.setItem("sniper_watchlist", JSON.stringify(watchlist));
  if (mode === "watchlist") render();
}

function drawSparkline(canvasId, dataArray, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!dataArray || dataArray.length === 0) { canvas.classList.remove("active"); return; }
  canvas.classList.add("active");
  const min = Math.min(...dataArray);
  const max = Math.max(...dataArray);
  const range = max - min === 0 ? 1 : max - min;
  const stepX = canvas.width / (dataArray.length - 1);
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  dataArray.forEach((val, i) => {
    const x = i * stepX;
    const y = canvas.height - ((val - min) / range) * (canvas.height - 4) - 2;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function formatCvdValue(val) {
  const abs = Math.abs(val);
  let str = "";
  if (abs >= 1e6) str = (abs / 1e6).toFixed(2) + " M";
  else if (abs >= 1e3) str = (abs / 1e3).toFixed(2) + " k";
  else str = abs.toFixed(2);
  return val >= 0 ? `+$${str}` : `-$${str}`;
}

function processKlinesForCVD(klines) {
  let cumulative = 0;
  const trend = [];
  klines.forEach(k => {
    const totalQuote = parseFloat(k[7]);
    const takerBuyQuote = parseFloat(k[10]);
    const delta = (takerBuyQuote * 2) - totalQuote;
    cumulative += delta;
    trend.push(cumulative);
  });
  return { cvd: cumulative, trend };
}

// 變更彈窗內的時區
function changeModalTimeframe(tf) {
  if (activeModalTimeframe === tf) return;
  activeModalTimeframe = tf;
  updateModalTabsUI();
  fetchModalData(activeModalSymbol, activeModalTimeframe);
}

// 更新彈窗時區按鈕的高亮狀態
function updateModalTabsUI() {
  document.querySelectorAll(".modal-tf-tabs button").forEach(btn => {
    if (btn.getAttribute("data-tf") === activeModalTimeframe) {
      btn.classList.add("active");
    } else {
      btn.classList.remove("active");
    }
  });
}

// 開啟彈窗（預設每次點開重設為 1小時 週期）
function openScoreModal(symbol) {
  activeModalSymbol = symbol;
  activeModalTimeframe = "1h"; 
  document.getElementById("modalTitle").innerText = `${symbol} 數據詳情`;
  document.getElementById("scoreModal").style.display = "flex";
  updateModalTabsUI();
  fetchModalData(symbol, activeModalTimeframe);
}

// 根據指定時區抓取 API 數據
function fetchModalData(symbol, interval) {
  const pair = `${symbol}USDT`;
  ["canvas-price","canvas-oi","canvas-lsr","canvas-fcvd","canvas-scvd"].forEach(id => document.getElementById(id).classList.remove("active"));
  ["priceTrendValue","openInterestValue","longShortRatio","futureCvdValue","spotCvdValue"].forEach(id => document.getElementById(id).innerText = "載入中...");

  // 1. 價格走勢 (對應選擇時區)
  fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${pair}&interval=${interval}&limit=12`).then(r=>r.json()).then(data => {
    if (!Array.isArray(data) || data.length === 0) return;
    const prices = data.map(k => parseFloat(k[4]));
    const firstPrice = prices[0];
    const lastPrice = prices[prices.length - 1];
    const changePct = ((lastPrice - firstPrice) / firstPrice) * 100;
    const color = lastPrice >= firstPrice ? "#26a69a" : "#ef5350";
    const el = document.getElementById("priceTrendValue");
    el.innerText = `${changePct >= 0 ? '+' : ''}${changePct.toFixed(2)}%`;
    el.style.color = color;
    drawSparkline("canvas-price", prices, color);
  }).catch(() => {
    document.getElementById("priceTrendValue").innerText = "取得失敗";
  });

  // 2. 24h 成交量 (與資金費率屬於當前全域快照資訊)
  fetch(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${pair}`).then(r=>r.json()).then(d => {
    if(d.quoteVolume) document.getElementById("volumeValue").innerText = `$${(parseFloat(d.quoteVolume)/1e6).toFixed(2)} M`;
  });
  fetch(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${pair}`).then(r=>r.json()).then(d => {
    if(d.lastFundingRate) {
      const rate = parseFloat(d.lastFundingRate);
      const el = document.getElementById("fundingRateValue");
      el.innerText = (rate*100).toFixed(4)+"%";
      el.style.color = rate>0?"#ef5350":rate<0?"#26a69a":"#fff";
    }
  });

  // 3. 未平倉量 OI 歷史趨勢 (對應選擇時區)
  fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${pair}`).then(r=>r.json()).then(d => {
    if(d.openInterest) {
      const val = (parseFloat(d.openInterest) * coinData[symbol].priceRaw) / 1e6;
      document.getElementById("openInterestValue").innerText = `$${val.toFixed(2)} M`;
      fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${pair}&period=${interval}&limit=12`).then(res=>res.json()).then(histData => {
        if(histData && histData.length > 0) {
          const oiTrend = histData.map(item => parseFloat(item.sumOpenInterestValue));
          drawSparkline("canvas-oi", oiTrend, oiTrend[oiTrend.length-1] >= oiTrend[0] ? "#26a69a" : "#ef5350");
        }
      }).catch(()=>{});
    }
  });

  // 4. 多空人數比歷史趨勢 (對應選擇時區)
  fetch(`https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=${pair}&period=${interval}&limit=12`).then(r=>r.json()).then(d => {
    if(d && d.length > 0) {
      const ratio = parseFloat(d[d.length-1].longShortRatio);
      const el = document.getElementById("longShortRatio");
      el.innerText = ratio.toFixed(2);
      const color = ratio < 1 ? "#26a69a" : "#ef5350";
      el.style.color = color;
      drawSparkline("canvas-lsr", d.map(item => parseFloat(item.longShortRatio)), color);
    }
  });

  // 5. 合約 CVD (對應選擇時區)
  fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${pair}&interval=${interval}&limit=12`).then(r=>r.json()).then(d => {
    const { cvd, trend } = processKlinesForCVD(d);
    const el = document.getElementById("futureCvdValue");
    el.innerText = formatCvdValue(cvd);
    const color = trend[trend.length-1] >= trend[0] ? "#26a69a" : "#ef5350";
    el.style.color = color;
    drawSparkline("canvas-fcvd", trend, color);
  }).catch(()=> document.getElementById("futureCvdValue").innerText = "取得失敗");

  // 6. 現貨 CVD (對應選擇時區)
  fetch(`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=${interval}&limit=12`).then(r=>r.json()).then(d => {
    if(d.code) throw new Error("No Spot");
    const { cvd, trend } = processKlinesForCVD(d);
    const el = document.getElementById("spotCvdValue");
    el.innerText = formatCvdValue(cvd);
    const color = trend[trend.length-1] >= trend[0] ? "#26a69a" : "#ef5350";
    el.style.color = color;
    drawSparkline("canvas-scvd", trend, color);
  }).catch(()=> {
    document.getElementById("spotCvdValue").innerText = "無現貨對";
    document.getElementById("spotCvdValue").style.color = "#aaa";
  });
}

function closeScoreModal(e) { document.getElementById('scoreModal').style.display = 'none'; }

function calculateSystemScores(symbolsArray) {
  Promise.all([
    fetch("https://fapi.binance.com/fapi/v1/premiumIndex").then(r=>r.json()),
    fetch("https://fapi.binance.com/fapi/v1/ticker/24hr").then(r=>r.json()),
    fetch("https://fapi.binance.com/fapi/v1/openInterest").then(r=>r.json())
  ]).then(([pData,tData,oiData]) => {
    const pMap  = Object.fromEntries(pData.map(p=>[p.symbol,p]));
    const tMap  = Object.fromEntries(tData.map(t=>[t.symbol,t]));
    const oiMap = Object.fromEntries(oiData.map(o=>[o.symbol,o]));
    symbolsArray.forEach(symbol => {
      const pair = `${symbol}USDT`;
      if (!pMap[pair]||!tMap[pair]||!oiMap[pair]||!coinData[symbol]) return;
      const fRate  = parseFloat(pMap[pair].lastFundingRate)||0;
      const qVolM  = parseFloat(tMap[pair].quoteVolume)/1e6||0;
      const oiValM = (parseFloat(oiMap[pair].openInterest)*coinData[symbol].priceRaw)/1e6||0;
      let score = -(fRate*2000);
      if (qVolM>500)  score += fRate<0?20:-20;
      if (oiValM>50)  score += fRate<0?20:-20;
      score = Math.max(-100,Math.min(100,Math.round(score)));
      coinData[symbol].score = score;
      const cell = document.getElementById(`score-${symbol}`);
      if (cell) {
        cell.innerText = score;
        cell.classList.remove("score-bullish","score-bearish");
        if (score>5)       cell.classList.add("score-bullish");
        else if (score<-5) cell.classList.add("score-bearish");
      }
    });
    updateHomeDashboards();
  }).catch(e=>console.log("計算失敗",e));
}

function initSystem() {
  fetch("https://fapi.binance.com/fapi/v1/ticker/24hr")
  .then(res=>res.json())
  .then(data => {
    const blacklist = ["BUSD","EUR","GBP","AUD","DAI","USDC","UP","DOWN","BEAR","BULL","BTT","USDTUSDT"];
    const symbolList = [];
    data
      .filter(x => x.symbol.endsWith("USDT") && !blacklist.some(b=>x.symbol.includes(b)) && parseFloat(x.quoteVolume) > 1000000)
      .forEach(item => {
        const symbol = item.symbol.replace("USDT","");
        symbolList.push(symbol);
        const row = document.createElement("tr");
        const price = parseFloat(item.lastPrice);
        const chg   = +item.priceChangePercent;
        const iconUrl = `https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/${symbol.toLowerCase()}.png`;
        const fallbackUrl = `https://cryptoicons.org/api/icon/${symbol.toLowerCase()}/50`;
        const isFav = watchlist.includes(symbol) ? '★' : '☆';
        row.innerHTML = `
          <td><div class="coin">
            <span id="fav-${symbol}" onclick="toggleWatchlist('${symbol}', event)" style="cursor:pointer;color:#f7931a;margin-right:5px;font-size:16px;user-select:none;">${isFav}</span>
            <img src="${iconUrl}" onerror="this.onerror=null; this.src='${fallbackUrl}';">
            <span>${symbol}</span>
          </div></td>
          <td id="price-${symbol}">$${fmtPrice(price)}</td>
          <td id="change-${symbol}" style="color:${chg>=0?'#26a69a':'#ef5350'}">${chg>=0?'+':''}${chg.toFixed(2)}%</td>
          <td id="score-${symbol}" class="score-cell" onclick="openScoreModal('${symbol}')">--</td>`;
        coinData[symbol] = { symbol, priceRaw: price, change: chg, el: row };
      });
    render();
    startSpotWs();
    startFutureWs();
    calculateSystemScores(symbolList);
    setInterval(()=>calculateSystemScores(symbolList), 30000);
  });
}

function startSpotWs() {
  if (spotWs) { try { spotWs.close(); } catch(e){} }
  spotWs = new WebSocket("wss://stream.binance.com:9443/ws/!miniTicker@arr");
  spotWs.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch(e) { return; }
    if (!Array.isArray(data)) return;
    data.forEach(item => {
      if (!item.s || !item.s.endsWith("USDT")) return;
      const symbol = item.s.replace("USDT","");
      if (!coinData[symbol]) return;
      const oldPrice = coinData[symbol].priceRaw;
      const newPrice = parseFloat(item.c);
      if (newPrice === oldPrice) return;
      coinData[symbol].priceRaw = newPrice;
      const cell = document.getElementById(`price-${symbol}`);
      if (!cell) return;
      cell.innerText = `$${fmtPrice(newPrice)}`;
      cell.classList.remove("flash-up","flash-down");
      void cell.offsetWidth;
      cell.classList.add(newPrice > oldPrice ? "flash-up" : "flash-down");
    });
  };
  spotWs.onclose = () => setTimeout(startSpotWs, 3000);
}

function startFutureWs() {
  if (futureWs) { try { futureWs.close(); } catch(e){} }
  futureWs = new WebSocket("wss://fstream.binance.com/ws/!miniTicker@arr");
  futureWs.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch(e) { return; }
    if (!Array.isArray(data)) return;
    data.forEach(item => {
      if (!item.s || !item.s.endsWith("USDT")) return;
      const symbol = item.s.replace("USDT","");
      if (!coinData[symbol]) return;
      const chgNew = parseFloat(item.P);
      if (isNaN(chgNew)) return;
      coinData[symbol].change = chgNew;
      const cell = document.getElementById(`change-${symbol}`);
      if (!cell) return;
      cell.innerText = `${chgNew >= 0 ? '+' : ''}${chgNew.toFixed(2)}%`;
      cell.style.color = chgNew >= 0 ? '#26a69a' : '#ef5350';
    });
  };
  futureWs.onclose = () => setTimeout(startFutureWs, 3000);
}
</script>
